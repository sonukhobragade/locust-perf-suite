name: gate

# The same checks tools/local_gate.sh runs locally. CI runs the gate script
# itself rather than repeating its steps here, so the two cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements.txt

      - name: Run the gate
        run: bash tools/local_gate.sh

  # requirements.txt used to install 342MB for a 77MB tool, and `flask` was
  # imported without being declared at all. This job installs only what the
  # runtime file lists, then imports every module the suite imports, so a
  # dependency that survives purely as somebody else's transitive install
  # fails here instead of in a user's first run.
  runtime-deps:
    name: runtime install is self-sufficient
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime requirements only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import what the suite imports
        run: |
          python -c "import locust, flask, grpc, prometheus_client, dotenv; print('ok')"
          python -c "import util.grpc_helper, util.locust_metrics, util.data_loader; print('ok')"

      - name: Report the install size
        run: du -sh $(python -c "import site; print(site.getsitepackages()[0])")
